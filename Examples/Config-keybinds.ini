; Merge these entries into the matching sections of Plugins\CustomSirens\Config.ini.
; Keep your other settings. This is an example, not a full replacement Config.ini.
; D8 / D9 are the number-row 5 / 6 keys. Existing tone keys stay compatible. D0-D9 available.
; These new bindings are read even when UseElsKeybinds=true.

[Settings]
HornInterruptsSiren=true
; Global overlay toggle, also available under F10 > Misc Settings > DEBUG.
; Hidden on foot. Shows the current vehicle's voices, WAVs, modes and extras.
Debug=false
; Horn cycling is configured per vehicle with Settings/HornCycleMode in its profile.

[Keybinds]
Snd_SrnTon5=D5
Snd_SrnTon6=D6
Toggle_Rumbler=D9
Toggle_FIAMMS=D0
; Extra controls are unbound by default. Example assignments:
; Toggle_RedBeacon=Control, B
; Toggle_MatrixText1=Control, NumPad1
; Toggle_MatrixText2=Control, NumPad2
; Toggle_MatrixText3=Control, NumPad3
Toggle_RedBeacon=/
Toggle_MatrixText1=None
Toggle_MatrixText2=None
Toggle_MatrixText3=None

[SirenVolumes]
Tone5Vol=1.0
Tone6Vol=1.0
FIAMMSVol=1.0
