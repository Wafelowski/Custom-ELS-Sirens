; Merge these entries into the matching sections of Plugins\CustomSirens\Config.ini.
; Keep your other settings. This is an example, not a full replacement Config.ini.
; D8 / D9 are the number-row 8 / 9 keys. Existing tone keys stay compatible.
; These new bindings are read even when UseElsKeybinds=true.
; Rumbler, FIAMMS, beacon and matrix keys apply to every vehicle.
; These keys are read only from Config.ini; profile [Keybinds] are ignored.

[SirenVolumes]
Tone1Vol=1
Tone2Vol=1
Tone3Vol=1
Tone4Vol=1
Tone5Vol=1
Tone6Vol=1
HornVol=1
ManualVol=1
FIAMMSVol=1

[Settings]
UseElsKeybinds=True
EnableLightStageTracking=False
CustomLightStageAmount=3
EnableControllerSupport=True
SirenLightRestriction=True
HornInterruptsSiren=True
; Global overlay toggle, also available under F10 > Misc Settings > DEBUG.
; Hidden on foot. Shows the current vehicle's voices, WAVs, modes and extras.
Debug=false
MasterVolume=0.2
AutomaticAiSirenCutoff=True
AiScanInterval=500
MaxAiUnits=10
FalloffExponent=1.5
MaxDistance=250
MinDistance=5
ReverbIntensity=1

[Keybinds]
; Keybind options: https://learn.microsoft.com/en-us/dotnet/api/system.windows.forms.keys?view=windowsdesktop-10.0#fields
MenuKey=F10
Sound_Manul=R
Snd_SrnTon1=D1
Snd_SrnTon2=D2
Snd_SrnTon3=D3
Snd_SrnTon4=D4
Snd_SrnTon5=D5
Snd_SrnTon6=D6
Toggle_Rumbler=D9
Toggle_FIAMMS=D0
; Extra controls are unbound by default. Example assignments:
; Toggle_RedBeacon=Control, B
; Toggle_MatrixText1=Control, NumPad1
; Toggle_MatrixText2=Control, NumPad2
; Toggle_MatrixText3=Control, NumPad3
Toggle_RedBeacon=None
Toggle_MatrixText1=None
Toggle_MatrixText2=None
Toggle_MatrixText3=None
Snd_SrnTonX=D8
Toggle_Lsts=J
Controller_Manul=B
Controller_SrnToggle=DPadDown
Controller_SrnTonX=DPadRight