; Copy to Plugins\CustomSirens\Profiles\YOUR_MODEL_NAME.ini and edit.
; The menu's Vehicle Specific profile uses the correct model filename for you.
; WAV filenames below are placeholders. Put your WAVs in Plugins\CustomSirens\WAVs.
; Existing four-tone profiles continue to work; unassigned Tone5/Tone6 are skipped.

[Sirens]
; Normal bank: used when rumbler is OFF or disabled.
Tone1=normal-tone1.wav
Tone2=normal-tone2.wav
Tone3=normal-tone3.wav
Tone4=normal-tone4.wav
Tone5=normal-tone5.wav
Tone6=normal-tone6.wav
Horn=normal-horn.wav
Manual=None
; Independent layered siren, toggled with F9 or its menu checkbox.
FIAMMS=fiamms.wav

[Rumbler]
; Enables this vehicle model's rumbler menu/key toggle. Runtime starts OFF.
Enabled=true

[RumblerSirens]
; ON bank replaces the normal WAV for the same slot.
; None, an empty value, or a missing WAV uses the normal bank's WAV for that slot.
Tone1=rumbler-tone1.wav
Tone2=rumbler-tone2.wav
Tone3=rumbler-tone3.wav
Tone4=rumbler-tone4.wav
Tone5=rumbler-tone5.wav
Tone6=rumbler-tone6.wav
Horn=None
Manual=None
; Optional alternate FIAMMS WAV; None keeps the normal FIAMMS sound.
FIAMMS=None

[SirenVolumes]
Tone1Vol=1.0
Tone2Vol=1.0
Tone3Vol=1.0
Tone4Vol=1.0
Tone5Vol=1.0
Tone6Vol=1.0
HornVol=1.0
ManualVol=1.0
FIAMMSVol=1.0

[RumblerVolumes]
; Independent ON-bank volumes, including slots that fall back to normal WAVs.
Tone1Vol=1.0
Tone2Vol=1.0
Tone3Vol=1.0
Tone4Vol=1.0
Tone5Vol=1.0
Tone6Vol=1.0
HornVol=1.0
ManualVol=1.0
FIAMMSVol=1.0

[VehicleExtras]
; Assign extra 1-12, or -1 to disable an option. Use each ID only once.
; 0 and values outside 1-12 are disabled, not reassigned to another extra.
; IDs are never inherited from Global.ini. Missing model extras are not changed.
; Matrix modes are mutually exclusive; pressing the active mode turns it OFF.
RedBeacon=-1
MatrixText1=-1
MatrixText2=-1
MatrixText3=-1

; Rumbler, FIAMMS, beacon and matrix keybinds are global in Config.ini.
; Legacy [Keybinds] entries in vehicle profiles and Global.ini are ignored.

[Settings]
; Per vehicle model only: Off, CarHorn, SirenHorn, or Silent.
; Off = normal horn behavior, no tone cycling.
; CarHorn = native car horn + cycle; SirenHorn = saved Horn WAV + cycle.
; Silent = suppress both horns and cycle immediately without interrupting the siren.
HornCycleMode=Off
; Per vehicle model only. True stops the main siren while the horn is held,
; then restarts it from the beginning on release. False mixes both sounds.
; Silent horn mode always cycles immediately regardless of this option.
; Missing values default to true; Config.ini/Global.ini values are ignored.
HornInterruptsSiren=true
SirenLightRestriction=true
EnableLightStageTracking=false
CustomLightStageAmount=3
